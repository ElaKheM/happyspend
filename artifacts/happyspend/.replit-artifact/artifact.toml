kind = "web"
previewPath = "/"
title = "HappySpend"
version = "1.0.0"
id = "artifacts/happyspend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22359

[services.development]
run = "pnpm --filter @workspace/happyspend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/happyspend", "run", "build" ]
publicDir = "artifacts/happyspend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22359"
BASE_PATH = "/"
